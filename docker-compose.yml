services:
  db:
    image: postgres:16-alpine
    container_name: onefi_marketplace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 1fi_marketplace
    ports:
      - '5432:5432'
    volumes:
      - onefi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d 1fi_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onefi_pgdata:
