services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: onefi-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://frontend-nqyp.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: onefi-db
          property: connectionString

  # ── Frontend ────────────────────────────────────────────────────────────────
  - type: web
    name: onefi-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://backend-257m.onrender.com

databases:
  - name: onefi-db
    plan: free
    databaseName: onefi_marketplace
    user: onefi
    region: singapore
